<!DOCTYPE html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Recipe Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="paper torn-look">
        <div id="output"></div>
    </div>

    <script>

        window.onload = async function () {

            // Custom method for FETCH API functionality
            const fetchMethod = async (url, fetchParameters, callback) => {
                try {
                    const response = await fetch(url, fetchParameters);
                    const contentType = response.headers.get('content-type') || '';
                    const json = contentType.includes('application/json')
                        ? await response.json()
                        : null;
                    callback(response.status, json);
                } catch (error) {
                    console.error('Fetch error:', error);
                }
            };

            const urlParams = new URLSearchParams(window.location.search);

            fetchMethod(
                '/getData/' + urlParams.get('id') + '/',
                { method: 'GET' },
                (status, json) => {
                    if (status !== 200) {
                        console.log(status);
                        return;
                    }
                    console.log(json, json.ingredients);
                    let displayTable = '<table>' +
                        '<thead>' +
                        '<tr>' +
                        '<th width="15%">Amount</th>' +
                        '<th width="15%">Measurement</th>' +
                        '<th width="15%">Ingredient</th>' +
                        '</tr>' +
                        '</thead>' +
                        '<tbody>';
                    for (let row of json.ingredients) {
                        console.log(row);
                        displayTable += '<tr>' +
                            '<td>' + row.amount + '</td>' +
                            '<td>' + row.measurement + '</td>' +
                            '<td>' + row.ingred + '</td>' +
                            '</tr>';
                    }
                    displayTable += `</tbody></table>`;
                    document.getElementById('output').innerHTML =
                        '<h2>' + json.recipe_name + '</h2>' +
                        '<p>' + json.instructions + '<p>'
                        + displayTable;
                }
            );
        };
    </script>
</body>

</html>
