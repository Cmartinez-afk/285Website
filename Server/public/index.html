<!doctype html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Recipe Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="canvas">

        <img src="strawberry1.png" class="sticker small top-left">
        <img src="strawberry2.png" class="sticker large bottom-left floaty">
        <img src="strawberry3.png" class="sticker large bottom-right">
        <div class="washi pink top"></div>
        <div class="washi green side"></div>
        <div class="washi green side2"></div>
        <div class="polaroid">
            <img src="polarid.png" alt="Polaroid Image">
        </div>
        <img src="lemon_doodle.png" class="doodle lemon">
        <img src="spoon_doodle.png" class="doodle spoon">
        <div class="pin"></div>

        <div class="paper torn-look">

            <h1>Recipe Book</h1>

            <div class="form-section">

                <label for="recipeName">Recipe Name</label>
                <input id="recipeName" type="text">

                <label for="category">Food Category</label>
                <select id="category">
                    <option></option>
                    <option>Breakfast</option>
                    <option>Lunch/Dinner</option>
                    <option>Dessert</option>
                </select>

                <label for="chefName">Chef Name</label>
                <input id="chefName" type="text">

                <label for="limit">Rows</label>
                <select id="limit">
                    <option></option>
                    <option>10</option>
                    <option>25</option>
                    <option>50</option>
                </select>

                <label for="sort">Sort</label>
                <select id="sort">
                    <option></option>
                    <option>A-Z</option>
                    <option>Z-A</option>
                </select>

                <button id="search">Search Recipes</button>
                <a href="insert.html">
                    <button id="add">Add Recipe</button>
                </a>

            </div>
        </div>

        <div id="recipes" class="recipe-grid"></div>

    </div>





    <script>
        const isEmpty = (obj) => Object.keys(obj).length === 0;

        document.getElementById('search').addEventListener('click', (event) => {
            const getParameters = {};

            if (document.getElementById('chefName').value.length !== 0) {
                getParameters.chefName = document.getElementById('chefName').value;
            }
            //the document.getElementById() needs to use the 'id' of the form element
            if (document.getElementById('recipeName').value.length !== 0) {
                //getParameters.name will turn into example.com/?recipeName=XXXX
                getParameters.recipeName = document.getElementById('recipeName').value;
            }
            if (document.getElementById('category').value.length !== 0) {
                getParameters.category = document.getElementById('category').value;
            }
            if (document.getElementById('limit').value.length !== 0) {
                getParameters.limit = document.getElementById('limit').value;
            }
            if (document.getElementById('sort').value.length !== 0) {
                getParameters.sort = document.getElementById('sort').value;
            }

            //Settings for FETCH API request
            let fetchSettings = {
                method: 'GET'
            };

            //Send FETCH API request
            fetch("http://localhost/recipe-book/" + (!isEmpty(getParameters) ? '?' + new URLSearchParams(getParameters) : ''), fetchSettings)
                .then((response) => {
                    return new Promise((resolve) => response.json()
                        .then((json) => resolve({
                            status: response.status,
                            json,
                        })
                        ));
                })
                //Logic to display errors on form 
                .then(({ status, json }) => {
                    if (status === 200) {
                        let displayCards = '<div class="recipe-grid">';
                        if (typeof json.data !== 'undefined') {
                            for (row of json.data) {
                                displayCards += `
                                    <div class="recipe-card">
                                        <h3>${row.recipe_name}</h3>
                                        <p><strong>Category:</strong> ${row.food_category}</p>
                                        <p><strong>Chef:</strong> ${row.user_inputting}</p>

                                        <div class="card-actions">
                                            <a href="edit.html?id=${row.id}">Edit</a>
                                            <a href="view.html?id=${row.id}">View</a>
                                        </div>
                                    </div>
                                `;
                            }
                        }
                        displayCards += '</div>';
                        document.getElementById('recipes').innerHTML = displayCards;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        });               
    </script>
</body>

</html>
