<!DOCTYPE html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Recipe Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Add Your Own Recipe</h2>


    <div class="paper torn-look">

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Recipe Name</label>
            </div>
            <div class='col-md-10'>
                <input id='recipeName' type='text' />
                <div id="recipeNameError" class="text-danger">&nbsp;</div>
            </div>
        </div>


        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Food Category</label>
            </div>
            <div class='col-md-10'>
                <select id='category'>
                    <option value=''></option>
                    <option value='breakfast'>Breakfast</option>
                    <option value='lunch/dinner'>Lunch/Dinner</option>
                    <option value='dessert'>Dessert</option>
                </select>
                <div id="foodCategoryError" class="text-danger">&nbsp;</div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Chef Name(Your Name)</label>
            </div>
            <div class='col-md-10'>
                <input id='chefName' type='text' />
            </div>
            <div id="chefNameError" class="text-danger">&nbsp;</div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label for="instructions">Recipe Instructions</label>
            </div>
            <div class='col-md-10'>
                <textarea id="instructions"></textarea>
                <div id="instructionsError" class="text-danger">&nbsp;</div>
            </div>
        </div>

        <div id="ingredientsContainer">

            <div class="ingredient-group row mb-3">
                <div class='col-md-2'>
                    <label>Ingredient</label>
                </div>
                <div class='col-md-10'>
                    <input name='ingredient[]' type='text' />
                </div>

                <div class='col-md-2'>
                    <label>Amount</label>
                </div>
                <div class='col-md-10'>
                    <input name='amount[]' type='text' />
                </div>

                <div class='col-md-2'>
                    <label>Measurement</label>
                </div>
                <div class='col-md-10'>
                    <input name='measurement[]' type='text' />
                </div>
            </div>

        </div>

        <div class="col-12">
            <button id="addIngredient">+</button>
        </div>

        <br>

        <button id="submit">Submit Recipe</button>

        <div id="invalid" class="alert alert-danger" hidden>
            Please fix the errors below.
        </div>

    </div>

    <script>
        document.getElementById('addIngredient').addEventListener('click', () => {

            const container = document.getElementById('ingredientsContainer');

            const newGroup = document.createElement('div');
            newGroup.className = "ingredient-group row mb-3";

            newGroup.innerHTML = `
        <div class='col-md-2'>
            <label>Ingredient</label>
        </div>
        <div class='col-md-10'>
            <input name='ingredient[]' type='text' />
        </div>

        <div class='col-md-2'>
            <label>Amount</label>
        </div>
        <div class='col-md-10'>
            <input name='amount[]' type='text' />
        </div>

        <div class='col-md-2'>
            <label>Measurement</label>
        </div>
        <div class='col-md-10'>
            <input name='measurement[]' type='text' />
        </div>
    `;

            container.appendChild(newGroup);
        });

        document.getElementById('submit').addEventListener('click', async (e) => {
            e.preventDefault();

            let hasError = false;
            const errorBanner = document.getElementById('invalid');
            errorBanner.hidden = true;

            function setError(id, message) {
                const el = document.getElementById(id);
                if (el) {
                    el.innerHTML = message;
                    if (message !== "&nbsp;") hasError = true;
                }
            }

            function clearError(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.innerHTML = "&nbsp;";
                }
            }

            clearError('recipeNameError');
            clearError('categoryError');
            clearError('chefNameError');
            clearError('instructionsError');

            const recipeName = document.getElementById('recipeName').value.trim();
            const category = document.getElementById('category').value;
            const chefName = document.getElementById('chefName').value.trim();
            const instructions = document.getElementById('instructions').value.trim();

            if (!recipeName) setError('recipeNameError', "Required");
            if (!category) setError('categoryError', "Required");
            if (!chefName) setError('chefNameError', "Required");
            if (instructions.length < 10) setError('instructionsError', "At least 10 characters");

            // INGREDIENTS
            const ingredients = document.getElementsByName('ingredient[]');
            const amounts = document.getElementsByName('amount[]');
            const measurements = document.getElementsByName('measurement[]');

            let ingredientData = [];

            for (let i = 0; i < ingredients.length; i++) {
                const ing = ingredients[i].value.trim();
                const amt = amounts[i].value.trim();
                const meas = measurements[i].value.trim();

                if (!ing || !amt || !meas) {
                    hasError = true;
                    ingredients[i].classList.add("is-invalid");
                    amounts[i].classList.add("is-invalid");
                    measurements[i].classList.add("is-invalid");
                } else {
                    ingredients[i].classList.remove("is-invalid");
                    amounts[i].classList.remove("is-invalid");
                    measurements[i].classList.remove("is-invalid");

                    ingredientData.push({
                        ingredient: ing,
                        amount: amt,
                        measurement: meas
                    });
                }
            }

            if (ingredientData.length === 0) {
                hasError = true;
            }

            if (hasError) {
                errorBanner.hidden = false;
                return;
            }

            const formData = new FormData();
            formData.append("recipeName", recipeName);
            formData.append("category", category);
            formData.append("chefName", chefName);
            formData.append("instructions", instructions);

            formData.append("ingredients", JSON.stringify(ingredientData));

            const response = await fetch('/recipe-book/', {
                method: 'POST',
                body: formData
            });

            const result = await response.json();
            alert(result.message);
        });
    </script>
</body>

</html>
