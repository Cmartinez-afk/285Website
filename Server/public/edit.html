<!DOCTYPE html>
<html>

<head>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Recipe Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>Edit a Recipe</h2>

    <div class="paper torn-look">

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Recipe Name</label>
            </div>
            <div class='col-md-10'>
                <input id='recipeName' type='text' />
                <div id="recipeNameError" class="text-danger">&nbsp;</div>
            </div>
        </div>


        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Food Category</label>
            </div>
            <div class='col-md-10'>
                <select id='category'>
                    <option value=''></option>
                    <option value='breakfast'>Breakfast</option>
                    <option value='lunch/dinner'>Lunch/Dinner</option>
                    <option value='dessert'>Dessert</option>
                </select>
                <div id="categoryError" class="text-danger">&nbsp;</div>
            </div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label>Chef Name(Your Name)</label>
            </div>
            <div class='col-md-10'>
                <input id='chefName' type='text' />
            </div>
            <div id="chefNameError" class="text-danger">&nbsp;</div>
        </div>

        <div class='row mb-3'>
            <div class='col-md-2'>
                <label for="instructions">Recipe Instructions</label>
            </div>
            <div class='col-md-10'>
                <textarea id="instructions"></textarea>
                <div id="instructionsError" class="text-danger">&nbsp;</div>
            </div>
        </div>

        <br>

        <button id="submit">Submit Recipe</button>

        <div id="invalid" class="alert alert-danger" hidden>
            Please fix the errors below.
        </div>

        <div id="success" class="alert alert-success" hiddden>
            Errors Cleared.
        </div>

    </div>

    <script>
        // Custom method for FETCH API functionality
            const fetchMethod = async (url, fetchParameters, callback) => {
                try {
                    const response = await fetch(url, fetchParameters);
                    const contentType = response.headers.get('content-type') || '';
                    const json = contentType.includes('application/json')
                        ? await response.json()
                        : null;
                    callback(response.status, json);
                } catch (error) {
                    console.error('Fetch error:', error);
                }
            };

        const urlParams = new URLSearchParams(window.location.search);

        // Fetch existing recipe data to populate the form using the recipe ID from the URL parameters 
        // edit.html?id=123 -> urlParams.get('id') will return 123 and recipe data with ID 123 will be 
        // fetched and used to populate the form fields
        fetchMethod(
            '/recipe-book/' + urlParams.get('id') + '/',
            {method: 'GET'},
            (status, json) =>{
                console.log(json.data.recipe_name);
                if(200 === status) {
                    // document.getElementById() needs to use the 'id' of the form element to populate the form fields with the existing recipe data
                    document.getElementById('recipeName').value = json.data.recipe_name;
                    document.getElementById('category').value = json.data.food_category.toLowerCase();
                    document.getElementById('chefName').value = json.data.user_inputting;
                    document.getElementById('instructions').value = json.data.instructions;
                }
            }
        )

        document.getElementById('submit').addEventListener('click', async (e) => {
            e.preventDefault();

            let hasError = false;
            const errorBanner = document.getElementById('invalid');
            const successBanner = document.getElementById('success');
            successBanner.hidden = true;
            errorBanner.hidden = true;

            function setError(id, message) {
                const el = document.getElementById(id);
                if (el) {
                    el.innerHTML = message;
                    if (message !== "&nbsp;") hasError = true;
                }
            }

            function clearError(id) {
                const el = document.getElementById(id);
                if (el) {
                    el.innerHTML = "&nbsp;";
                }
            }

            clearError('recipeNameError');
            clearError('categoryError');
            clearError('chefNameError');
            clearError('instructionsError');

            const recipeName = document.getElementById('recipeName').value.trim();
            const category = document.getElementById('category').value;
            const chefName = document.getElementById('chefName').value.trim();
            const instructions = document.getElementById('instructions').value.trim();

            if (!recipeName) setError('recipeNameError', "Required");
            if (!category) setError('categoryError', "Required");
            if (!chefName) setError('chefNameError', "Required");
            if (instructions.length < 10) setError('instructionsError', "At least 10 characters");

            if (hasError) {
                errorBanner.hidden = false;
                return;
            }
            else{
                successBanner.hidden = false;
                return;
            }

            const formData = new FormData();
            formData.append("recipeName", recipeName);
            formData.append("category", category);
            formData.append("chefName", chefName);
            formData.append("instructions", instructions);

            const urlParams = new URLSearchParams(window.location.search);

            fetchMethod(
                '/recipe-book/' + urlParams.get('id') + '/',
                {method: 'PUT', body: formData},
                (status, json) => {
                    if(200 === status){
                        console.log(json);
                    }
                }
            );
        });
    </script>
</body>

</html>
